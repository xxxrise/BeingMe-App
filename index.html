function fatal(e){let raw='';try{raw=localStorage.getItem(KEY)||''}catch(_){}const m=String(e&&e.message||e);document.body.innerHTML=`<div style="max-width:440px;margin:0 auto;padding:40px 20px;font-family:Nunito,system-ui,sans-serif"><h2 style="margin:0 0 8px">Не удалось запустить приложение</h2><p>Твои данные не удалены. Скопируй текст ниже и сохрани его: позже его можно загрузить через «Настройки → Данные и перенос».</p><textarea readonly style="width:100%;height:160px;border-radius:14px;padding:10px;font:12px monospace">${esc(raw)}</textarea><button id="frl" style="margin-top:12px;padding:12px 20px;border-radius:16px;background:#8F7CE6;color:#fff;font-weight:800">Перезагрузить</button><p style="opacity:.6;font-size:12px;margin-top:14px">${esc(m)}</p></div>`;const b=document.getElementById('frl');if(b)b.onclick=()=>location.reload()}
