<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EFFA;--sheet:#FFFFFF;--soft:#F6F3FC;--ink:#3B3555;--mute:#8B84A6;--line:#E9E3F6;--acc:#8F7CE6;--accsoft:#E3DCFA;--done:#7CCBAA;--mint:#CFF0E3;--peach:#FFDDCF;--lilac:#E0D8FA;--butter:#FFF1BF;--sky:#D5E9FB;--sh:0 10px 30px rgba(110,90,170,.14);

:root[data-theme="dark"]{--bg:#1D1930;--sheet:#2A2542;--soft:#342E50;--ink:#EEEAFB;--mute:#A59DC4;--line:#413A5F;--accsoft:#4A4175;--sh:0 10px 30px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Nunito,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
#app{max-width:480px;margin:0 auto;position:relative}

.stage::before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;bottom:-70px;background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%)}

.hop{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{30%{transform:translateY(-16px) scale(1.04,.97)}100%{transform:none}}
.bob{animation:bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px) scale(1.01,.99)}}
.hud{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:2;color:#3B3555}
.pill{background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;padding:7px 13px;font-weight:800;display:flex;align-items:center;gap:9px;font-size:15px}
.bar{width:60px;height:7px;background:rgba(143,124,230,.2);border-radius:9px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s cubic-bezier(.3,1.2,.5,1)}
.cn{display:inline-block;width:14px;height:14px;border-radius:50%;background:#F7C95C;box-shadow:inset 0 0 0 3px #FBDD8A;vertical-align:-2px;margin-right:5px}
.sheet{position:relative;z-index:1;margin-top:-26px;min-height:70vh;background:var(--sheet);border-radius:30px 30px 0 0;padding:22px 16px 120px;box-shadow:0 -8px 30px rgba(110,90,170,.12);animation:in .35s ease-out}

.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}

.row.done{background:color-mix(in srgb,var(--mint) 55%,var(--sheet))}
.em{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:22px;flex:none}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.tx b{font-weight:800;overflow-wrap:anywhere}

.dots{display:flex;gap:5px;margin-top:6px}

.chk:active{transform:scale(.88)}

.done .chk svg{stroke-dashoffset:0}
.t.done .tx b{text-decoration:line-through;color:var(--mute)}

.empty{text-align:center;color:var(--mute);padding:26px 18px}

.item:active{transform:scale(.96)}
.item.on{border-color:var(--acc)}
.pv{height:88px;border-radius:14px;overflow:hidden;display:flex;justify-content:center;padding:4px}
.pv svg{height:100%;width:auto}
.item b{font-size:14px;font-weight:800;padding:0 4px}
.item small{color:var(--mute);font-weight:700;padding:0 4px 2px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 20px));display:grid;grid-template-columns:1fr 1fr 54px 1fr 1fr;background:var(--sheet);border-radius:26px;padding:5px;box-shadow:var(--sh)}

.ind{position:absolute;top:5px;bottom:5px;left:5px;width:20%;background:var(--accsoft);border-radius:21px;transition:transform .5s cubic-bezier(.3,1.3,.5,1),width .3s}
.toast{position:fixed;z-index:6;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:18px;font-weight:700;opacity:0;pointer-events:none;transition:.35s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pop{position:fixed;z-index:9;font-weight:800;font-size:20px;color:#D9A21B;pointer-events:none;animation:pop 1s ease-out forwards}

.hr{display:flex;gap:8px}.pill button{font-size:15px;line-height:1;padding:2px}

.hp{position:absolute;z-index:2;top:12px;left:14px;right:14px;height:10px;background:rgba(59,53,85,.14);border-radius:9px;overflow:hidden}.hp u{display:block;height:100%;width:100%;background:#F18CA2;border-radius:9px;transition:width .25s}
.boss{position:absolute;top:30px;left:50%;width:110px;margin-left:-55px;transition:transform .15s}.boss.hit{transform:scale(.92) rotate(-4deg)}
.hero{position:absolute;bottom:4px;left:50%;height:112px;transform:translateX(-50%)}.hero svg{height:100%;width:auto;overflow:visible}
.hearts{position:absolute;z-index:2;top:30px;left:14px;font-size:16px;letter-spacing:2px}.combo{position:absolute;z-index:2;top:30px;right:14px;font-weight:800;color:#8F7CE6}
.bub{position:absolute;left:0;top:0;width:78px;height:78px;border-radius:50%;z-index:1;font-weight:800;font-size:12px;line-height:1.15;padding:6px;color:#3B3555;background:#EAE4F7;box-shadow:inset 0 -6px 0 rgba(59,53,85,.08),0 6px 14px rgba(110,90,170,.18);will-change:transform;touch-action:manipulation}.bub.bg{background:#FFE9A0;font-size:30px}.bub.bp{background:#FFC9C0;font-size:30px}.bub.boom{opacity:0;transition:opacity .25s}
.ov{position:absolute;z-index:3;inset:0;background:rgba(243,239,250,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:#3B3555}.ov h3{margin:0;font-size:24px;font-weight:800}.ov p{margin:0;font-size:14px;color:#6A6388}.ov .add{width:auto;padding:12px 28px;font-size:17px;margin-top:6px}.arena.sk{animation:shake .4s}
.nav button svg{display:block;margin:1px auto}
.lazy{position:absolute;left:8%;bottom:22px;z-index:1;display:none;width:40px;transition:width .5s,opacity .5s;animation:bob 3.4s ease-in-out infinite}.lazy svg{width:100%;display:block}.dots i.miss{background:#F5B5A2}
.dlg{position:fixed;inset:0;z-index:20;background:rgba(30,25,50,.5);display:flex;align-items:center;justify-content:center;padding:24px}.dc{background:var(--sheet);border-radius:28px;padding:22px;max-width:320px;text-align:center;box-shadow:var(--sh);animation:in .35s}.dc h3{margin:8px 0 4px;font-size:22px;font-weight:800}.dc p{margin:0 0 16px;color:var(--mute)}.di{width:72px;margin:0 auto}
.tw{position:absolute;left:0;right:0;bottom:0;height:0;transition:transform .35s ease-out}.bl{position:absolute;height:26px;border-radius:9px;box-shadow:0 2px 0 rgba(59,53,85,.12)}.bl span{display:block;text-align:center;line-height:26px;font-size:15px;overflow:hidden;white-space:nowrap}.th{position:absolute;left:50%;bottom:100%;margin-left:-19px;height:56px;pointer-events:none}.th svg{height:100%;width:auto;overflow:visible}
.ring{position:relative;width:min(250px,70vw);aspect-ratio:1;margin:6px auto 10px}.ring svg{width:100%;height:100%}.rb,.rf{fill:none;stroke-width:12;stroke-linecap:round}.rb{stroke:var(--line)}.rf{stroke:var(--acc);stroke-dasharray:616;stroke-dashoffset:0;transition:stroke-dashoffset .4s linear,stroke .4s}.rf.br{stroke:var(--done)}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rt b{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.rt span{color:var(--mute);font-weight:700}.rt small{color:var(--acc);font-weight:700;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd{display:flex;justify-content:center;gap:8px;margin-bottom:16px}.pd i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .3s}.pd i.on{background:var(--acc)}
.pb{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px}.pgo{background:var(--acc);color:#fff;font-weight:800;font-size:18px;padding:14px 30px;border-radius:22px;min-width:140px;transition:transform .2s}.pgo:active{transform:scale(.95)}
.set{display:grid;gap:10px}.st{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:18px;padding:8px 8px 8px 16px;font-weight:700}.st div{display:flex;align-items:center;gap:6px}.st b{min-width:66px;text-align:center;font-weight:800}.st div button{width:36px;height:36px;border-radius:12px;background:var(--accsoft);color:var(--acc);font-size:20px;font-weight:800}
.sw{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;margin-right:6px;transition:background .25s}.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s}.sw.on{background:var(--done)}.sw.on i{transform:translateX(22px)}
select{width:100%;background:var(--soft);border:2px solid transparent;border-radius:18px;padding:12px 14px;outline:0;color:var(--ink);font:inherit}
.fs{position:absolute;z-index:2;top:14px;left:0;right:0;text-align:center;font-size:42px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(59,53,85,.3);pointer-events:none}.fh{position:absolute;z-index:1;left:52px;top:0;height:64px;will-change:transform}.pr{transform-box:fill-box;transform-origin:center;animation:prop .12s linear infinite}@keyframes prop{50%{transform:scaleY(.35)}}.jm{animation:jm .3s ease-out}@keyframes jm{40%{transform:translateY(-6px)}}.fc{position:absolute;left:15px;width:26px;height:26px;border-radius:50%;background:#F7C95C;box-shadow:inset 0 0 0 4px #FBDD8A;transition:transform .3s,opacity .3s}.fc.gone{transform:scale(1.8);opacity:0}.fk{position:absolute;z-index:2;top:20px;left:14px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(59,53,85,.3)}.fh svg{height:100%;width:auto;overflow:visible}.pl{position:absolute;z-index:1;left:0;top:0;width:56px;height:100%;will-change:transform}.pl i{position:absolute;left:0;width:56px;background:linear-gradient(90deg,#B7AAE8,#D6CEF5)}.pl i.t{top:0;border-radius:0 0 16px 16px}.pl i.b{bottom:0;border-radius:16px 16px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

const P=["mint","peach","lilac","butter","sky"], EM=["💧","🚶","📖","🧘","🥗","😴","✍️","🏃"];
const CK='<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2 8.8-9.4"/></svg>';
const I={
c0:{k:"color",n:"Лаванда",p:0,d:"#BDB0F0"},c1:{k:"color",n:"Мята",p:20,d:"#A8DEC9"},c2:{k:"color",n:"Персик",p:20,d:"#FFC2A8"},c3:{k:"color",n:"Небо",p:25,d:"#A9D3F5"},

const VB={color:"30 10 140 205",head:"55 8 90 90",face:"60 40 80 60",neck:"40 80 120 120",bg:"30 10 140 205"};
const CATS=[["color","Цвет"],["head","Голова"],["face","Лицо"],["neck","Шея"],["bg","Фон"]];
let S,tab="habits",cat="color",edit=false,tt;

const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const mn=n=>n%10===1&&n%100!==11?"монеты":"монет";

 if(!S||!S.habits)S={coins:0,xp:0,owned:["c0","b0"],eq:{color:"c0",head:null,face:null,neck:null,bg:"b0"},
  habits:["Выпить воды","Прогулка 20 минут","Почитать"].map((n,i)=>({id:uid(),n,e:EM[i],days:{},c:today()})),tasks:[]};S.snd=S.snd||{fx:true,mus:false};S.gw=S.gw||{d:'',n:0};S.pm=S.pm||{f:25,s:5,l:15,n:4,auto:false,d:'',cnt:0,min:0};S.pt=S.pt||{ph:'f',run:false,rem:1500000,tot:1500000,end:0,cyc:0,task:''};S.neg=S.neg||{last:'',lazy:0}}

   if(p.cf&&!p.g&&Math.abs(100-(p.x+28))<28&&Math.abs(g.y+36-p.gy)<30){p.g=1;p.cf.classList.add('gone');g.co++;$('#fk').innerHTML=`<i class='cn'></i>`+g.co;sfx('coin')}
   if(p.x<-PW-4){p.e.remove();g.ps=g.ps.filter(q=>q!==p)}
   else if(140>p.x&&58<p.x+PW&&(g.y+16<p.gy-GAP/2||g.y+54>p.gy+GAP/2))dead=true}
  fh.style.transform=`translateY(${g.y}px) rotate(${Math.max(-25,Math.min(55,g.vy/9))}deg)`;
  if(dead){fend(g);return}
  g.raf=requestAnimationFrame(loop)};g.raf=requestAnimationFrame(loop)}
function fend(g){g.st='end';cancelAnimationFrame(g.raf);sfx('hit');const k=today();if(S.gw.fd!==k){S.gw.fd=k;S.gw.fn=0}const c=Math.max(0,Math.min(g.co,20-S.gw.fn));S.gw.fn+=c;gain(c,g.sc>=5?10:2);setTimeout(()=>sfx(g.sc>=5?'win':'lose'),250);const b=S.gw.fb=Math.max(S.gw.fb||0,g.sc);save();const ov=$('#ov');ov.innerHTML=`<h3>${g.sc>=5?'Отличный полёт!':'Падение'}</h3><p>Очки: ${g.sc}. Монет собрано: ${g.co}. Рекорд: ${b}</p><p><b><i class='cn'></i>+${c}</b>${S.gw.fn>=20?' (лимит на сегодня)':''}</p><button class='add' data-a='go'>Ещё раз</button><button class='ghost' data-a='back'>К играм</button>`;ov.style.display='flex'}
const PL={f:'Фокус',s:'Перерыв',l:'Длинный перерыв'},TT='Мой герой — привычки и задачи';
const pdur=ph=>S.pm[ph]*60000;
function rst(){const t=S.pt;t.rem=t.tot=pdur(t.ph)}
function fmt(ms){const s=Math.ceil(ms/1000);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function post(){const b=$('.nav button.on'),i=$('#ind');if(b){i.style.width=b.offsetWidth+'px';i.style.transform=`translateX(${b.offsetLeft-5}px)`}updPom()}
function updPom(){const t=S.pt,p=S.pm,L=t.run?Math.max(0,t.end-Date.now()):t.rem;document.title=t.run?fmt(L)+' '+PL[t.ph]:TT;const e=$('#pt');if(!e)return;e.textContent=fmt(L);$('#pl').textContent=PL[t.ph];const tk=S.tasks.find(x=>x.id===t.task&&!x.done);$('#pk').textContent=t.ph==='f'&&tk?tk.n:'';const r=$('#pr');r.style.strokeDashoffset=616*(1-L/(t.tot||1));r.classList.toggle('br',t.ph!=='f');$('#pg').textContent=t.run?'Пауза':L<t.tot?'Продолжить':'Старт';const on=t.ph==='l'?p.n:t.cyc%p.n;$('#pd').innerHTML=Array.from({length:p.n},(_,i)=>`<i class='${i<on?'on':''}'></i>`).join('');const td=p.d===today();$('#pst').textContent='Сегодня: '+(td?p.cnt:0)+' сесс. · '+(td?p.min:0)+' мин'}
function pdone(skip){const t=S.pt,p=S.pm,k=today();if(p.d!==k){p.d=k;p.cnt=0;p.min=0}
 if(t.ph==='f'){if(!skip){const m=p.f,c=Math.floor(m/5);p.cnt++;p.min+=m;gain(c,Math.round(m/2));toast(c?'Фокус завершён! Награда: '+c+' 🪙':'Фокус завершён!')}t.cyc++;t.ph=t.cyc%p.n===0?'l':'s'}else t.ph='f';
 t.run=false;rst();if(!skip){sfx('bell');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}if(p.auto){t.run=true;t.end=Date.now()+t.rem}}save();updPom()}
const pomo=()=>{const p=S.pm,t=S.pt,st=(k,l,u)=>`<div class='st'><span>${l}</span><div><button data-a='pm' data-id='${k}-' aria-label='Меньше'>−</button><b>${p[k]}${u}</b><button data-a='pm' data-id='${k}+' aria-label='Больше'>+</button></div></div>`;
 return `<div class='hd'><div><h2>Фокус</h2><p id='pst'></p></div></div><div class='ring'><svg viewBox='0 0 220 220'><circle class='rb' cx='110' cy='110' r='98'/><circle class='rf' id='pr' cx='110' cy='110' r='98' transform='rotate(-90 110 110)'/></svg><div class='rt'><b id='pt'></b><span id='pl'></span><small id='pk'></small></div></div><div class='pd' id='pd'></div><div class='pb'><button class='ghost' data-a='prs'>Сброс</button><button class='pgo' id='pg' data-a='pgo'>Старт</button><button class='ghost' data-a='psk'>Пропуск</button></div><div class='set'>${st('f','Фокус',' мин')}${st('s','Перерыв',' мин')}${st('l','Длинный перерыв',' мин')}${st('n','Сессий до длинного','')}<div class='st'><span>Автозапуск следующего</span><button class='sw ${p.auto?'on':''}' data-a='pauto' aria-label='Автозапуск'><i></i></button></div><select id='ptask' aria-label='Задача'><option value=''>Без задачи</option>${S.tasks.filter(x=>!x.done).map(x=>`<option value='${x.id}' ${t.task===x.id?'selected':''}>${esc(x.n)}</option>`).join('')}</select></div>`};
document.addEventListener('change',e=>{if(e.target.id==='ptask'){S.pt.task=e.target.value;save();updPom()}});
window.addEventListener('resize',post);
setInterval(()=>{if(S.pt.run&&Date.now()>=S.pt.end)pdone();if(S.neg.last&&S.neg.last<addDays(today(),-1)){evalNeg();if(tab==='habits')render()}updPom()},300);
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dk(d)}
let nb=-1;
function lazy(d){const N=S.neg;N.lazy=Math.max(0,Math.min(100,N.lazy+d));negUI()}
function negUI(){const z=S.neg.lazy,e=$('#lazy');if(!e)return;if(!e.firstChild)e.innerHTML=BOSS;e.style.display=z>=15?'block':'none';e.style.width=(36+z*.5)+'px';e.style.opacity=.4+z/170;const b=z>=60?3:z>=40?2:z>=25?1:0;if(b!==nb){nb=b;stage()}}
function dlg(t){const d=document.createElement('div');d.className='dlg';d.id='dlg';d.innerHTML=`<div class='dc'><div class='di'>${BOSS}</div><h3>Лень не дремлет</h3><p>${t}</p><button class='pgo' data-a='dlg'>Понял</button></div>`;document.body.appendChild(d);sfx('hit')}
function evalNeg(){const N=S.neg,y=addDays(today(),-1);if(!N.last){N.last=y;save();return}if(N.last>=y)return;let d=addDays(N.last,1),miss=0,steal=0;const st=addDays(y,-6);if(d<st)d=st;
 for(;d<=y;d=addDays(d,1)){const hs=S.habits.filter(h=>!h.c||h.c<=d);if(!hs.length)continue;if(hs.filter(h=>h.days[d]).length===0){miss++;const s=Math.min(S.coins,5);S.coins-=s;steal+=s;N.lazy=Math.min(100,N.lazy+15)}else N.lazy=Math.max(0,N.lazy-10)}
 N.last=y;save();hud();negUI();if(miss)dlg('Дней без привычек: '+miss+'. '+(steal?'Лень украла '+steal+' 🪙 и подкралась ближе.':'Лень подкралась ближе.')+' Отметь привычку сегодня, чтобы отогнать её, или победи Лень в игре.')}
const BH=28;
const tarena=()=>`<div class='hd'><div><h2>Башня воли</h2><p>Строй башню из своих привычек</p></div><button class='ghost' data-a='back'>Назад</button></div><div class='arena' id='arena'><div class='fs' id='fs'>0</div><div class='tw' id='tw'><div class='th' id='th'>${char(S.eq,null,true)}</div></div><div class='ov' id='ov'><h3>Башня воли</h3><p>Нажимай, чтобы опустить блок точно на предыдущий. Лишнее отрезается, а три идеальных попадания подряд расширяют блок. Твой герой едет на вершине, а на блоках твои привычки.</p><p>Каждые 3 этажа — монета, до 15 монет в день</p><button class='add' data-a='go'>Начать</button></div></div>`;
function runTower(){const ar=$('#arena'),tw=$('#tw'),th=$('#th');ar.querySelectorAll('.bl').forEach(e=>e.remove());const W=ar.clientWidth,g=G={t:'tw',st:'run',W,bl:[],n:0,combo:0,last:performance.now()};
 ar.style.backgroundSize='100% 400%';ar.style.backgroundPosition='0 100%';tw.style.transform='';$('#ov').style.display='none';$('#fs').textContent='0';
 const mk=(x,w,i)=>{const e=document.createElement('div'),h=(i*26+250)%360;e.className='bl';e.style.cssText=`left:${x}px;width:${w}px;bottom:${i*BH}px;background:linear-gradient(180deg,hsl(${h} 80% 88%),hsl(${h} 65% 76%))`;e.innerHTML=`<span>${S.habits.length?S.habits[i%S.habits.length].e:'⭐'}</span>`;tw.appendChild(e);return e};
 const deb=(x,w,i,bg)=>{const e=mk(x,w,i);e.style.background=bg;e.firstChild.textContent='';requestAnimationFrame(()=>{e.style.transition='transform .9s ease-in,opacity .9s';e.style.transform='translateY(360px) rotate(25deg)';e.style.opacity='0'});setTimeout(()=>e.remove(),950)};
 g.bl.push({x:(W-150)/2,w:150});mk((W-150)/2,150,0);
 const next=()=>{const top=g.bl[g.bl.length-1],i=g.bl.length,l=i%2===0;g.cur={w:top.w,x:l?0:W-top.w,dir:l?1:-1,i};g.cur.e=mk(g.cur.x,g.cur.w,i);g.cur.e.appendChild(th)};next();
 ar.onpointerdown=()=>{if(G!==g||g.st!=='run')return;const c=g.cur,top=g.bl[g.bl.length-1],nx0=Math.max(c.x,top.x),rt=Math.min(c.x+c.w,top.x+top.w),ov=rt-nx0;
  if(ov<=0){g.st='end';c.e.style.transition='transform .8s ease-in,opacity .8s';c.e.style.transform='translateY(320px) rotate(18deg)';c.e.style.opacity='0';sfx('hit');setTimeout(()=>tend(g),700);return}
  let nx=nx0,nw=ov;const bg=c.e.style.background;
  if(Math.abs(c.x-top.x)<=5){g.combo++;nx=top.x;nw=c.w;if(g.combo>=3){nw=Math.min(150,c.w+8);nx=Math.max(0,Math.min(g.W-nw,top.x-(nw-c.w)/2))}sfx('pop',g.combo)}
  else{g.combo=0;sfx('tap');if(c.x<nx0)deb(c.x,nx0-c.x,c.i,bg);if(c.x+c.w>rt)deb(rt,c.x+c.w-rt,c.i,bg)}
  c.e.style.left=nx+'px';c.e.style.width=nw+'px';g.bl.push({x:nx,w:nw});g.n++;$('#fs').textContent=g.n+(g.combo>=2?' ×'+g.combo:'');
  th.classList.remove('jm');void th.offsetWidth;th.classList.add('jm');
  tw.style.transform=`translateY(${Math.max(0,g.n*BH-240)}px)`;ar.style.backgroundPosition=`0 ${100-Math.min(100,g.n*2.5)}%`;next()};
 const loop=t=>{if(G!==g||g.st!=='run')return;const dt=Math.min(.04,(t-g.last)/1000),c=g.cur,v=150+Math.min(g.n*7,230);g.last=t;c.x+=c.dir*v*dt;if(c.x<0){c.x=0;c.dir=1}if(c.x+c.w>g.W){c.x=g.W-c.w;c.dir=-1}c.e.style.left=c.x+'px';g.raf=requestAnimationFrame(loop)};g.raf=requestAnimationFrame(loop)}
function tend(g){if(G!==g)return;const f=g.n,k=today(),Z=S.gw;if(Z.td!==k){Z.td=k;Z.tn=0}const c=Math.max(0,Math.min(Math.floor(f/3),15-Z.tn));Z.tn+=c;Z.tb=Math.max(Z.tb||0,f);gain(c,c?c*4:2);sfx(f>=8?'win':'lose');save();const ov=$('#ov');ov.innerHTML=`<h3>${f>=8?'Отличная башня!':'Башня рухнула'}</h3><p>Этажей: ${f}. Рекорд: ${Z.tb}</p><p><b><i class='cn'></i>+${c}</b>${Z.tn>=15?' (лимит на сегодня)':''}</p><button class='add' data-a='go'>Ещё раз</button><button class='ghost' data-a='back'>К играм</button>`;ov.style.display='flex'}
load();hud();stage();snd();render();negUI();evalNeg();
</script>
